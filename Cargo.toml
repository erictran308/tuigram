[package]
name = "tuigram-cli"
version = "0.2.0"
edition = "2024"
description = "Telegram in your terminal: a fast, vim-style Telegram client built on TDLib"
license = "MIT"
repository = "https://github.com/erictran308/tuigram"
readme = "README.md"
keywords = ["telegram", "tui", "terminal", "tdlib", "vim"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", ".env.example"]

# The command is `tuigram`; the crate name `tuigram` was taken on crates.io.
[[bin]]
name = "tuigram"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
image = "0.25"
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[build-dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
