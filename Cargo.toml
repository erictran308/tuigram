[package]
name = "tuigram"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
futures = "0.3.34"
image = "0.25"
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[build-dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
