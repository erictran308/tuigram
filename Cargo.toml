[package]
name = "tuigram-cli"
version = "0.8.0"
edition = "2024"
description = "Telegram in your terminal: a fast, vim-style Telegram client built on TDLib"
license = "MIT"
repository = "https://github.com/erictran308/tuigram"
readme = "README.md"
keywords = ["telegram", "tui", "terminal", "tdlib", "vim"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", ".env.example", ".github", "docs"]

# The command is `tuigram`; the crate name `tuigram` was taken on crates.io.
[[bin]]
name = "tuigram"
path = "src/main.rs"

# `cargo binstall tuigram-cli` installs the binary from the GitHub release,
# which has tuigram's API key built in (see .github/workflows/release.yml).
# Its fallbacks are off: QuickInstall's binaries and building from source
# would have no key. Without a release binary, binstall says so instead, and
# `cargo install` remains for building from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tuigram-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "tuigram{ binary-ext }"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tuigram-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tuigram-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.22"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
emojis = "0.9.0"
futures = "0.3.34"
image = "0.25"
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tdlib-rs = { version = "1.4.0", features = ["static"] }
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["download-tdlib"]
# Where TDLib comes from: tdlib-rs's build script downloads it (the default),
# or it's a copy already checked, in LOCAL_TDLIB_PATH, as release builds use.
download-tdlib = ["tdlib-rs/download-tdlib"]
local-tdlib = ["tdlib-rs/local-tdlib"]

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
